[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-secure"
version = "0.1.0"
description = "Layered security for eye disease data through cryptography and steganographic techniques"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
eye-secure = "eye_secure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
